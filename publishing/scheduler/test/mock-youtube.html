<!doctype html><html><body>
<input type="file" id="f">
<div id="dlg" hidden>
  <div id="title-textarea"><div id="textbox" contenteditable="true">filename</div></div>
  <div id="description-textarea"><div id="textbox" contenteditable="true"></div></div>
  <ytcp-video-metadata-playlists><ytcp-dropdown-trigger onclick="pl.hidden=false">Select</ytcp-dropdown-trigger></ytcp-video-metadata-playlists>
  <ytcp-playlist-dialog id="pl" hidden><label onclick="cb.setAttribute('aria-checked','true')"><span id="cb" role="checkbox" aria-checked="false"></span>Season 1: After Sign-Off</label><button onclick="pl.hidden=true;document.querySelector('ytcp-dropdown-trigger').textContent=cb.getAttribute('aria-checked')==='true'?'Season 1: After Sign-Off':'Select'">Done</button></ytcp-playlist-dialog>
  <tp-yt-paper-radio-button name="VIDEO_MADE_FOR_KIDS_NOT_MFK" onclick="window.kids='no'">No</tp-yt-paper-radio-button>
  <button id="toggle-button" onclick="adv.hidden=false">Show more</button>
  <div id="adv" hidden><tp-yt-paper-radio-button name="VIDEO_HAS_ALTERED_CONTENT_NO" onclick="window.alt='no'">No</tp-yt-paper-radio-button><div id="tags-container"><input></div></div>
  <button id="next-button" onclick="window.nexts=(window.nexts||0)+1; if(window.nexts>=3) vis.hidden=false">Next</button>
  <div id="vis" hidden><button id="second-container-expand-button" onclick="sch.hidden=false">Schedule</button>
    <div id="sch" hidden><div id="datepicker-trigger" onclick="dp.hidden=false">Nov 12, 2026</div>
    <ytcp-date-picker id="dp" hidden><input onkeydown="if(event.key==='Enter'){document.getElementById('datepicker-trigger').textContent=this.value;dp.hidden=true}"></ytcp-date-picker>
    <div id="time-of-day-container"><input value="12:00 AM"></div></div></div>
  <ytcp-video-upload-progress>Uploading 40%</ytcp-video-upload-progress>
  <button id="done-button" onclick="share.hidden=false">Schedule</button>
</div>
<ytcp-video-share-dialog id="share" hidden><a href="https://youtu.be/MOCK123">link</a><button id="close-button" onclick="share.hidden=true">Close</button></ytcp-video-share-dialog>
<script>f.onchange=()=>{dlg.hidden=false;setTimeout(()=>document.querySelector('ytcp-video-upload-progress').textContent='Upload complete ... Checking',1500);setTimeout(()=>{document.querySelector('ytcp-video-upload-progress').textContent='Checks complete. No issues found.';document.getElementById('done-button').setAttribute('aria-disabled','false')},4000)}</script>
</body></html>
